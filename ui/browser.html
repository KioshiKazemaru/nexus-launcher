<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Браузер Nexus</title><link rel="stylesheet" href="browser.css"></head>
<body>
<header id="bar">
  <div class="strip"><span class="brand-mark" aria-hidden="true">N</span><nav id="tabs" role="tablist" aria-label="Вкладки"></nav><button id="new-tab" class="icon" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка">+</button></div>
  <div class="nav">
    <button id="back" class="icon" title="Назад (Alt+←)" aria-label="Назад">←</button>
    <button id="forward" class="icon" title="Вперёд (Alt+→)" aria-label="Вперёд">→</button>
    <button id="reload" class="icon" title="Обновить (F5)" aria-label="Обновить">↻</button>
    <form id="address-form" class="address"><span id="lock" class="lock" aria-hidden="true"></span><input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Адрес или поиск" aria-label="Адрес или поиск"><span id="signed" class="signed" hidden title="Страница открыта с входом в Steam из Nexus">Steam</span></form>
  </div>
  <div id="crashed" class="crashed" hidden>Страница перестала работать. Остальные вкладки и Nexus работают. <button id="crash-reload">Обновить страницу</button></div>
  <div id="downloads" class="downloads" hidden></div>
</header>
<script src="browser.js"></script>
</body></html>
