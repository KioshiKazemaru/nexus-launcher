<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: nexus-art: https://*.steamstatic.com https://steamcdn-a.akamaihd.net https://cdn1.epicgames.com https://cdn2.epicgames.com https://cdn2.unrealengine.com https://images.igdb.com https://cdn2.steamgriddb.com https://images.steamusercontent.com; media-src https://*.steamstatic.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Nexus — все игры рядом</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar">
  <div class="app-strip">
    <div class="client-menu">
      <button class="brand" data-page="store"><img src="assets/nexus.png" alt="">Nexus</button>
      <span class="nav-group">
        <button class="client-menu-button" data-page="library">Вид</button>
        <span class="nav-menu">
          <button data-page="library">Библиотека</button>
          <button data-page="downloads">Загрузки</button>
          <button data-page="storage">Хранилище</button>
        </span>
      </span>
      <button class="client-menu-button" data-page="activity">Друзья</button>
      <span class="nav-group">
        <button class="client-menu-button" data-page="recent">Игры</button>
        <span class="nav-menu">
          <button data-page="recent">Недавние</button>
          <button data-page="favorites">Избранное</button>
        </span>
      </span>
      <span class="alpha" id="app-version"></span>
    </div>
    <div id="account-status" class="account-status" aria-live="polite"></div>
    <button id="bp-enter" class="bp-enter" title="Режим геймпада (кнопка Guide на геймпаде)" aria-label="Режим геймпада">🎮</button>
  </div>
  <nav aria-label="Разделы Nexus">
    <span class="nav-history"><button id="nav-back" aria-label="Назад" title="Назад" disabled>←</button><button id="nav-forward" aria-label="Вперёд" title="Вперёд" disabled>→</button></span>
    <button class="nav active" data-page="store" data-nav-pages="store game">МАГАЗИН</button>
    <span class="nav-group">
      <button class="nav" data-page="library" data-nav-pages="library recent favorites downloads storage">БИБЛИОТЕКА</button>
      <span class="nav-menu">
        <button data-page="library">Главная</button>
        <button data-page="recent">Недавние</button>
        <button data-page="favorites">Избранное</button>
        <button data-page="downloads">Загрузки</button>
        <button data-page="storage">Хранилище</button>
      </span>
    </span>
    <span class="nav-group">
      <button class="nav" data-page="activity" data-nav-pages="activity news friend">СООБЩЕСТВО</button>
      <span class="nav-menu">
        <button data-page="activity">Активность друзей</button>
        <button data-page="news">Новости</button>
      </span>
    </span>
    <button class="nav" data-page="profile">ПРОФИЛЬ</button>
    <button class="nav" data-page="wishlist">ЖЕЛАЕМОЕ <span id="wish-count">0</span></button>
    <button class="nav" data-page="tracking">СКИДКИ</button>
    <button class="nav nav-settings" data-page="accounts">АККАУНТЫ</button>
  </nav>
</header>
<div class="layout"><aside><div class="side-head"><button class="library-home" data-page="library">Библиотека <span id="lib-count" hidden>0</span></button><button class="side-icon" data-page="library" title="Все игры сеткой" aria-label="Все игры сеткой">▦</button></div><div class="side-tools"><select id="side-source" aria-label="Какие игры показывать"><option value="all">Игры и программы</option><option value="steam">Steam</option><option value="epic">Epic Games</option><option value="family">Семейная библиотека</option></select><button class="side-icon" data-page="recent" title="Недавние" aria-label="Недавние">◷</button><button class="side-icon" id="side-ready" title="Только установленные" aria-label="Только установленные">▶</button></div><div class="side-search"><span aria-hidden="true">⌕</span><input id="side-search" type="search" placeholder="Поиск" aria-label="Поиск в списке игр" autocomplete="off"><button class="side-icon" id="side-sort" title="Порядок: по названию" aria-label="Порядок">☰</button></div><div id="library-tree"></div></aside>
<main id="main">
  <div class="toolbar">
    <div id="breadcrumb"></div>
    <div class="store-subnav" id="store-tools" hidden>
      <div class="store-platforms" role="group" aria-label="Магазин">
        <button data-store-platform="all">Все магазины</button>
        <button data-store-platform="steam">Steam</button>
        <button data-store-platform="epic">Epic Games</button>
      </div>
      <label class="region"><span>Регион</span><select id="store-country" aria-label="Регион каталога"></select></label>
    </div>
    <label class="search"><span class="search-icon" aria-hidden="true"></span><input id="search" type="search" placeholder="Найти игру…" aria-label="Поиск игр"><kbd>Ctrl K</kbd></label>
  </div>
  <div id="content"></div>
</main></div>
<footer>
  <div class="footer-left">
    <button id="footer-add" class="footer-add"><span class="footer-add-icon" aria-hidden="true">+</span> Добавить игру</button>
    <button class="footer-add footer-storage" data-page="storage" title="Место на дисках и папки игр">Хранилище</button>
  </div>
  <button class="footer-downloads" data-page="downloads" aria-live="polite" title="Загрузки Steam и Epic Games">
    <span class="footer-download-icon" aria-hidden="true">↓</span>
    <span><strong>Загрузки</strong><small id="footer-downloads">Нет активных загрузок</small></span>
    <i class="footer-downloads-bar" id="footer-downloads-bar"></i>
  </button>
  <div class="footer-right">
    <span class="footer-mode"><i class="small-dot steam"></i> <span id="mode-label">Локальная библиотека</span></span>
    <span id="footer-status"></span>
    <button id="scan">↻ Обновить игры на ПК</button>
    <button id="friends-toggle" class="footer-friends" title="Открыть окно друзей и чата">Друзья и чат <small id="friends-count"></small><b id="friends-unread" class="friends-unread" hidden></b></button>
  </div>
</footer>
<div id="store-hover" class="store-hover" role="status"></div><div id="library-hover" class="library-hover" role="status"></div><div id="bigpicture" class="bigpicture" hidden></div><div id="toast" role="status" aria-live="polite"></div><div id="update-popup" class="update-popup" role="dialog" aria-labelledby="update-popup-title" hidden></div><div id="offline-banner" class="offline-banner" hidden>Нет подключения к интернету · показаны сохранённые данные</div>
<script src="demo.js"></script><script src="app-base.js"></script><script src="app-store.js"></script><script src="app-deals.js"></script><script src="app-library.js"></script><script src="app-social.js"></script><script src="app-events.js"></script><script src="app-boot.js"></script><script src="bigpicture.js"></script></body></html>
