<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: nexus-art: https://*.steamstatic.com https://steamcdn-a.akamaihd.net https://cdn1.epicgames.com https://cdn2.epicgames.com https://cdn2.unrealengine.com https://images.igdb.com https://cdn2.steamgriddb.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Nexus — все игры рядом</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="app-strip"><button class="brand" data-page="store"><span class="brand-mark">N</span> Nexus <span class="alpha">0.10.4 · WINDOWS</span></button><div id="account-status" class="account-status" aria-live="polite"></div></div><nav><span class="nav-history"><button id="nav-back" aria-label="Назад" title="Назад" disabled>❮</button><button id="nav-forward" aria-label="Вперёд" title="Вперёд" disabled>❯</button></span><button class="nav active" data-page="store">МАГАЗИН</button><button class="nav" data-page="library">БИБЛИОТЕКА</button><button class="nav" data-page="wishlist">ЖЕЛАЕМОЕ <span id="wish-count">0</span></button><button class="nav" data-page="tracking">СКИДКИ</button><button class="nav nav-settings" data-page="accounts">АККАУНТЫ</button></nav></header>
<div class="layout"><aside><button class="library-home" data-page="library">Библиотека <span id="lib-count">0</span> ▦</button><div class="sidebar-filters"><button class="chip active" data-list-filter="all">Все</button><button class="chip" data-list-filter="steam">Steam</button><button class="chip" data-list-filter="epic">Epic</button></div><div id="collection-list" class="collection-list"></div><div id="library-tree"></div><div class="side-bottom"><button class="side-link" data-page="favorites">☆ Избранное</button><button class="side-link" data-page="recent">◷ Недавние</button><button class="side-link" data-page="downloads">⇩ Загрузки</button><button class="side-link" data-page="storage">▤ Хранилище</button><button class="side-link" id="add-game">＋ Добавить игру</button></div></aside>
<main id="main"><div class="toolbar"><div id="breadcrumb">МАГАЗИН <span>/ ОБЗОР</span></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Найти игру…" aria-label="Поиск игр"><kbd>Ctrl K</kbd></label></div><div id="content"></div></main></div>
<footer><button id="footer-add" class="footer-add">＋ ДОБАВИТЬ ИГРУ</button><button class="footer-downloads" data-page="downloads" aria-live="polite" title="Загрузки Steam и Epic Games"><strong>ЗАГРУЗКИ</strong><small id="footer-downloads">Нет активных загрузок</small><i class="footer-downloads-bar" id="footer-downloads-bar"></i></button><div class="footer-right"><span class="footer-mode"><i class="small-dot steam"></i> <span id="mode-label">Локальная библиотека</span></span><span id="footer-status">Steam в приоритете · покупка в официальном магазине</span><button id="scan">↻ &nbsp; Обновить игры на ПК</button><button id="friends-toggle" class="footer-friends" title="Открыть окно друзей и чата">ДРУЗЬЯ И ЧАТ <small id="friends-count"></small><b id="friends-unread" class="friends-unread" hidden></b></button></div></footer>
<dialog id="details"><button class="close" aria-label="Закрыть">×</button><div id="detail-content"></div></dialog><div id="store-hover" class="store-hover" role="status"></div><div id="library-hover" class="library-hover" role="status"></div><div id="toast" role="status" aria-live="polite"></div><div id="offline-banner" class="offline-banner" hidden>Нет подключения к интернету · показаны сохранённые данные</div>
<script src="demo.js"></script><script src="app.js"></script></body></html>
