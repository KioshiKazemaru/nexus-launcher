<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: nexus-art: https://*.steamstatic.com https://steamcdn-a.akamaihd.net https://cdn1.epicgames.com https://cdn2.epicgames.com https://cdn2.unrealengine.com https://images.igdb.com https://cdn2.steamgriddb.com https://images.steamusercontent.com; media-src https://*.steamstatic.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Nexus — все игры рядом</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="app-strip"><button class="brand" data-page="store"><span class="brand-mark">N</span> Nexus <span class="alpha">0.12.14 · WINDOWS</span></button><div id="account-status" class="account-status" aria-live="polite"></div><button id="bp-enter" class="bp-enter" title="Режим геймпада (кнопка Guide на геймпаде)" aria-label="Режим геймпада">🎮</button></div><nav><span class="nav-history"><button id="nav-back" aria-label="Назад" title="Назад" disabled>❮</button><button id="nav-forward" aria-label="Вперёд" title="Вперёд" disabled>❯</button></span><button class="nav active" data-page="store">МАГАЗИН</button><span class="nav-group"><button class="nav" data-page="library" data-nav-pages="library recent favorites downloads storage">БИБЛИОТЕКА</button><span class="nav-menu"><button data-page="library">Главная</button><button data-page="recent">Недавние</button><button data-page="favorites">Избранное</button><button data-page="downloads">Загрузки</button><button data-page="storage">Хранилище</button></span></span><span class="nav-group"><button class="nav" data-page="activity" data-nav-pages="activity news friend">СООБЩЕСТВО</button><span class="nav-menu"><button data-page="activity">Активность друзей</button><button data-page="news">Новости</button></span></span><button class="nav" data-page="profile">ПРОФИЛЬ</button><button class="nav" data-page="wishlist">ЖЕЛАЕМОЕ <span id="wish-count">0</span></button><button class="nav" data-page="tracking">СКИДКИ</button><button class="nav nav-settings" data-page="accounts">АККАУНТЫ</button></nav></header>
<div class="layout"><aside><div class="side-head"><button class="library-home" data-page="library">Библиотека <span id="lib-count" hidden>0</span></button><button class="side-icon" data-page="library" title="Все игры сеткой" aria-label="Все игры сеткой">▦</button></div><div class="side-tools"><select id="side-source" aria-label="Какие игры показывать"><option value="all">Игры и программы</option><option value="steam">Steam</option><option value="epic">Epic Games</option></select><button class="side-icon" data-page="recent" title="Недавние" aria-label="Недавние">◷</button><button class="side-icon" id="side-ready" title="Только установленные" aria-label="Только установленные">▶</button></div><div class="side-search"><span aria-hidden="true">⌕</span><input id="side-search" type="search" placeholder="Поиск" aria-label="Поиск в списке игр" autocomplete="off"><button class="side-icon" id="side-sort" title="Порядок: по названию" aria-label="Порядок">☰</button></div><div id="library-tree"></div></aside>
<main id="main"><div class="toolbar"><div id="breadcrumb">МАГАЗИН <span>/ ОБЗОР</span></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Найти игру…" aria-label="Поиск игр"><kbd>Ctrl K</kbd></label></div><div id="content"></div></main></div>
<footer><div class="footer-left"><button id="footer-add" class="footer-add">＋ ДОБАВИТЬ ИГРУ</button><button class="footer-add footer-storage" data-page="storage" title="Место на дисках и папки игр">⛁ ХРАНИЛИЩЕ</button></div><button class="footer-downloads" data-page="downloads" aria-live="polite" title="Загрузки Steam и Epic Games"><strong>ЗАГРУЗКИ</strong><small id="footer-downloads">Нет активных загрузок</small><i class="footer-downloads-bar" id="footer-downloads-bar"></i></button><div class="footer-right"><span class="footer-mode"><i class="small-dot steam"></i> <span id="mode-label">Локальная библиотека</span></span><span id="footer-status">Steam в приоритете · покупка в официальном магазине</span><button id="scan">↻ &nbsp; Обновить игры на ПК</button><button id="friends-toggle" class="footer-friends" title="Открыть окно друзей и чата">ДРУЗЬЯ И ЧАТ <small id="friends-count"></small><b id="friends-unread" class="friends-unread" hidden></b></button></div></footer>
<div id="store-hover" class="store-hover" role="status"></div><div id="library-hover" class="library-hover" role="status"></div><div id="bigpicture" class="bigpicture" hidden></div><div id="toast" role="status" aria-live="polite"></div><div id="offline-banner" class="offline-banner" hidden>Нет подключения к интернету · показаны сохранённые данные</div>
<script src="demo.js"></script><script src="app-base.js"></script><script src="app-store.js"></script><script src="app-library.js"></script><script src="app-social.js"></script><script src="app-events.js"></script><script src="app-boot.js"></script><script src="bigpicture.js"></script></body></html>
