# Lint, tests, test installers and one start of the built app on Windows, macOS and Linux.
# Started by hand, by a push to main or by a version tag. Only a tag (v0.15.7) publishes:
# the job "release" makes the GitHub release from the three builds. Elsewhere it only
# checks that the notes and all 11 files of a release are there.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml: what the installed Nexus reads to find an update; it goes into
          # the release next to the installers.
          - os: windows-latest
            dist: npm run dist
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
              dist/beta.yml
          - os: macos-latest
            dist: npm run dist:mac
            files: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
              dist/beta-mac.yml
          - os: ubuntu-latest
            dist: npm run dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
              dist/beta-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm test
      # Unsigned test builds: macOS and Windows warn about an unknown developer.
      - run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The built app is started once with an empty profile: the main window has to
      # open and the log must show no error (scripts/smoke-launch.cjs). Linux runners
      # have no screen, so a virtual one (xvfb).
      - name: Start the built Nexus once
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb >/dev/null
            xvfb-run -a node scripts/smoke-launch.cjs
          else
            node scripts/smoke-launch.cjs
          fi
      # Windows code signing through SignPath (docs/signing.md). Only once the SignPath
      # project is set up (repository variables SIGNPATH_* and the secret
      # SIGNPATH_API_TOKEN), and not for pull requests: they get no secrets.
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-unsigned
          path: dist/*.exe
          if-no-files-found: error
      - name: Sign the installer
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      # The signed installer replaces the unsigned one; latest.yml names its new SHA-512
      # and size. The block map belongs to the unsigned bytes: without it the update is
      # downloaded whole.
      - name: Put the signed installer in place
        if: steps.unsigned.outcome == 'success'
        shell: bash
        run: |
          cp dist-signed/*.exe dist/
          rm -f dist/*.blockmap
          node scripts/rehash-latest.cjs dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Checks the tag against package.json, takes the notes from README
      # ("## Что нового в X") plus docs/release-footer.md and picks the 11 files.
      - run: node scripts/release.cjs artifacts release "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # v0.16.0-beta.1: a pre-release, offered only with «Получать бета-версии».
        run: |
          case "$TAG" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          cd release
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag             --title "Nexus Launcher ${TAG#v}" -F notes.md $PRE $(ls | grep -v '^notes.md$')
