# Lint, tests, test installers and one start of the built app on Windows, macOS and Linux.
# Started by hand or by a push to main; nothing is published. The macOS and Linux
# installers of a release are taken from this run's artifacts.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml: what the installed Nexus reads to find an update; it goes into
          # the release next to the installers.
          - os: windows-latest
            dist: npm run dist
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - os: macos-latest
            dist: npm run dist:mac
            files: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
          - os: ubuntu-latest
            dist: npm run dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm test
      # Unsigned test builds: macOS and Windows warn about an unknown developer.
      - run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The built app is started once with an empty profile: the main window has to
      # open and the log must show no error (scripts/smoke-launch.cjs). Linux runners
      # have no screen, so a virtual one (xvfb).
      - name: Start the built Nexus once
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb >/dev/null
            xvfb-run -a node scripts/smoke-launch.cjs
          else
            node scripts/smoke-launch.cjs
          fi
      # Windows code signing through SignPath (docs/signing.md). Only once the SignPath
      # project is set up (repository variables SIGNPATH_* and the secret
      # SIGNPATH_API_TOKEN), and not for pull requests: they get no secrets.
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-unsigned
          path: dist/*.exe
          if-no-files-found: error
      - name: Sign the installer
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      # The signed installer replaces the unsigned one; latest.yml names its new SHA-512
      # and size. The block map belongs to the unsigned bytes: without it the update is
      # downloaded whole.
      - name: Put the signed installer in place
        if: steps.unsigned.outcome == 'success'
        shell: bash
        run: |
          cp dist-signed/*.exe dist/
          rm -f dist/*.blockmap
          node scripts/rehash-latest.cjs dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
